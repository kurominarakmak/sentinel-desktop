[workspace]
members = [
  "crates/sentinel-core",
  "crates/sentinel-runtime",
  "crates/sentinel-agent-api",
  "crates/sentinel-fake-agent",
  "crates/sentinel-git",
  "crates/sentinel-process",
  "crates/sentinel-probe",
  "crates/sentinel-codex",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
sha2 = "0.10"
uuid = { version = "1.12", features = ["v4", "serde"] }
unicode-normalization = "0.1"
